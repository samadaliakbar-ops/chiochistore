[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'no build step needed — static file + one function'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
